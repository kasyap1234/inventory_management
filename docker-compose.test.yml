# Docker Compose for Test Environment
# This file provides a minimal setup for running integration tests
# Usage: docker-compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: postgres:17.5-alpine
    ports:
      - "5440:5432"
    environment:
      - POSTGRES_DB=agromart2_test
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d agromart2_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests (data not persisted)

volumes:
  postgres_test_data:
