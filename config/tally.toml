[tally]
api_key = "test_api_key"
api_secret = "test_api_secret"
api_endpoint = "http://localhost:9001"
database_url = "postgres://user:password@localhost:5432/main_db"
test_database_url = "postgres://user:password@localhost:5432/test_db"

[queuing]
redis_addr = "localhost:6379"
redis_password = ""
redis_db = 0
concurrency = 10
queues = ["critical", "default", "low"]

[queuing.queue_priorities]
critical = 6
default = 3
low = 1

[export_import]
mode = "async"
timeout_seconds = 60
max_retry_attempts = 3
retry_delay_seconds = 5